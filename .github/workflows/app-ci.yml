# Margokit Pro (app/): lint, types, unit + integration tests (in-memory MongoDB), official
# e-invoice validation (EN 16931 / Peppol Schematron, veraPDF), production build, then e2e.
name: app-ci
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app-ci.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/app-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ hashFiles('app/package-lock.json') }}
      - run: npm ci
      - run: npm run lint
      - name: Types (route types are generated by Next.js first)
        run: npx next typegen && npx tsc --noEmit
      - name: Official validation rules (EN 16931, Peppol BIS, veraPDF)
        run: npm run schematron:setup && npm run verapdf:setup
      - run: npm test
      - name: Production build (no secrets needed)
        run: npm run build

  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ hashFiles('app/package-lock.json') }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Local MongoDB replica set (port 27018)
        run: |
          nohup npm run db > db.log 2>&1 &
          for i in $(seq 1 90); do (echo > /dev/tcp/127.0.0.1/27018) 2>/dev/null && exit 0; sleep 1; done
          cat db.log; exit 1
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: app/test-results
          retention-days: 7
