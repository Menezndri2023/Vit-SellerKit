# Daily encrypted backup of the production database (MongoDB Atlas M0 has no automatic backups).
# The dump is encrypted (AES-256, PBKDF2) BEFORE upload: this repository is public, and artifacts
# of public repositories can be downloaded by any GitHub user. Restore: docs/pro/BACKUP.md
# Secrets: MONGODB_BACKUP_URI (read-only Atlas user: "Only read any database"), BACKUP_PASSPHRASE (long, random).
name: db-backup
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGODB_URI: ${{ secrets.MONGODB_BACKUP_URI }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "$MONGODB_URI" ] || [ ${#BACKUP_PASSPHRASE} -lt 32 ]; then
            echo "::error::Set the MONGODB_BACKUP_URI and BACKUP_PASSPHRASE (32+ characters) repository secrets"; exit 1
          fi
      - name: Dump (mongodump, gzip archive)
        run: docker run --rm -e MONGODB_URI mongo:8.0 sh -c 'mongodump --uri="$MONGODB_URI" --archive --gzip' > dump.archive.gz
      - name: Encrypt and verify
        run: |
          test -s dump.archive.gz
          NAME="margokit-$(date -u +%Y-%m-%d).archive.gz.enc"
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in dump.archive.gz -out "$NAME" -pass env:BACKUP_PASSPHRASE
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in "$NAME" -pass env:BACKUP_PASSPHRASE | cmp - dump.archive.gz
          shred -u dump.archive.gz
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          ls -l "$NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}
          retention-days: 30
          compression-level: 0
